name: db_core
description: Core module containing shared utilities, network, and architecture for the project.
version: 1.0.0
publish_to: 'none'

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  
  # --- Network & API ---
  # HTTP client for making API requests
  dio: 5.9.2
  # Logging interceptor for Dio to format and print request/response logs
  pretty_dio_logger: ^1.4.0
  # General purpose logging library for debugging and error tracking
  logger: ^2.7.0
  # Check and monitor internet connection status
  connectivity_plus: ^7.1.1

  # --- State Management ---
  # BLoC/Cubit implementation for predictable state management
  flutter_bloc: 9.1.1
  # Dependency injection and simple state management
  provider: ^6.1.5+1

  # --- Local Storage ---
  # Store simple key-value pairs locally
  shared_preferences: ^2.5.5
  # Securely store sensitive data like tokens and keys
  flutter_secure_storage: ^10.0.0

  # --- UI & Navigation ---
  # Advanced asset picker (WeChat style)
  wechat_assets_picker: ^9.4.0
  wechat_camera_picker: ^4.3.1
  # Image cropping
  image_cropper: ^12.2.1
  # Permission management
  permission_handler: ^12.0.1
  # Custom route transitions and animations between screens
  page_transition: ^2.2.1
  # Highly customizable image widget with cache and zoom support
  extended_image: ^10.0.1
  # Flexible toast and snackbar notification system
  flash: ^3.1.1
  # Easy to use and customizable alert dialogs
  rflutter_alert: ^2.0.7
  # Network image with caching and placeholder support
  cached_network_image: ^3.4.1
  # Cache manager used by cached_network_image (required for custom cache config)
  flutter_cache_manager: ^3.4.1
  # Shimmer effect for skeleton loading (UX improvement)
  shimmer: ^3.0.0
  
  # --- Utilities ---
  # Base class for value-based equality comparison
  equatable: ^2.0.8
  # Automatically resizes text to fit perfectly within its bounds
  flutter_auto_size_text: ^5.0.0
  # A set of utility libraries for Dart (inspired by Google Guava)
  quiver: ^3.2.2
  # Find commonly used locations on the device filesystem
  path_provider: ^2.1.5
  # Internationalization and localization support (date, number formatting)
  intl: ^0.20.2
  # Highly customizable calendar widget
  table_calendar: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Default lint rules for Flutter to ensure code quality
  flutter_lints: ^3.0.0
