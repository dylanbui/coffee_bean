name: coffee_bean
description: "Coffee Bean Flutter Project - RIBs Architecture."
publish_to: 'none'

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+3

environment:
  # xem xet hard fix ^3.11.4
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.22.0"

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  # iOS : CupertinoIcons.shopping_cart
  # Android : Icons.shopping_cart
  cupertino_icons: ^1.0.8

  # --- Local Modules ---
  # Core module for network, storage, and shared utilities
  db_core:
    path: ./packages/db_core
  # Local database module (Isar)
  coffee_bean_db:
    path: ./packages/coffee_bean_db

  # --- Logic & Architecture ---
  # State management framework
  flutter_bloc: 9.1.1
  # Dependency Injection and simple state management
  provider: ^6.1.5+1
  # Type-safe HTTP client generator
  retrofit: 4.9.2

  # --- UI Components ---
  # SVG image rendering support
  flutter_svg: ^2.2.4
  # Animated list with reordering capabilities
  implicitly_animated_reorderable_list_2: ^0.6.0
  # Lottie animation rendering (JSON based)
  lottie: ^3.3.3
  # Material Design motion system (Container transform, shared axis, etc.)
  animations: ^2.2.0
  # Declarative animation library for easy drop-in effects
  flutter_animate: ^4.5.2
  # Scrolling text effect
  marquee: ^2.3.0
  # Group button selector widget
  group_button: ^5.3.4
  # Scrollable list with jump-to-index support
  scrollable_positioned_list: ^0.3.8
  # Rating bar widget
  flutter_rating_bar: ^4.0.1
  # Timeline-based date picker
  easy_date_timeline: ^2.0.9

  # --- System & Media Features ---
  # Google Sign-In
  google_sign_in: ^7.2.0
  # Sign in with Apple
  sign_in_with_apple: ^8.0.0
  # Pick images and videos from gallery or camera
  image_picker: ^1.1.2
  # QR and Barcode scanner
  mobile_scanner: ^6.0.0
  # Open URLs, send emails, make calls
  url_launcher: ^6.3.2
  # Detailed device hardware information
  device_info_plus: ^11.1.1
  # User GPS location services
  geolocator: ^14.0.2
  # Application package information (version, build number)
  package_info_plus: ^9.0.1
  # In-app network log interceptor for debugging
  chuck_interceptor: ^2.3.1
  # Network image with caching and placeholder support
  cached_network_image: ^3.4.1
  # Cache manager used by cached_network_image (required for custom cache config)
  flutter_cache_manager: ^3.4.1

  # --- Utilities & Optimization ---
  # Firebase Core and Remote Config
  firebase_core: ^4.10.0
  firebase_remote_config: ^6.5.2
#  firebase_core: ^3.10.1
#  firebase_remote_config: ^6.0.0

  # Debounce and throttle utility
  easy_debounce: ^2.0.3
  # Easy localization
  easy_localization: ^3.0.8
  # Annotations for JSON code generation
  json_annotation: ^4.12.0
  # Splash screen management
  flutter_native_splash: ^2.4.7
  # Internationalization and localization support (date, number formatting)
  intl: ^0.20.2

  # --- Payment gateway ---
  flutter_inappwebview: ^6.1.5
  crypto: ^3.0.7
  http: ^1.6.0
  uuid: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # --- Code Generation Tools ---
  # Core tool for code generation (Retrofit, JSON, etc.)
  build_runner: ^2.4.13
  # Generator for Retrofit clients
  retrofit_generator: ^10.2.6
  # Generator for JSON serialization
  json_serializable: ^6.13.1
  # Generate app icons for multiple platforms
  flutter_launcher_icons: ^0.14.4
  # Standard lint rules for clean code
  flutter_lints: ^6.0.0

# The following section is specific to Flutter packages.
flutter:
  assets:
    - assets/images/
    - assets/images/member_card/
    - assets/json/
    - assets/icons/
    - assets/translations/

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  fonts:
    - family: Source Sans Pro
      fonts:
        - asset: assets/fonts/SourceSansPro-Regular.ttf
        - asset: assets/fonts/SourceSansPro-Light.ttf
          weight: 300
        - asset: assets/fonts/SourceSansPro-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/SourceSansPro-SemiBold.ttf
          weight: 600

# Terminal run : flutter pub run flutter_launcher_icons
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_coffee.png" # Đường dẫn đến tệp hình ảnh bạn vừa lưu
  min_sdk_android: 21
  # Bạn có thể thêm cấu hình màu nền cho Android adaptive icon nếu cần:
  # adaptive_icon_background: "#FFFFFF"
  # adaptive_icon_foreground: "assets/images/app_icon_foreground.png"

# Terminal run : dart run flutter_native_splash:create
flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#121212"
  image: assets/images/app_coffee_medium.png
#  image_dark: assets/images/app_coffee_small.png
  android_12:
    image: assets/images/app_coffee_medium.png
#    image_dark: assets/images/app_coffee_small.png
    icon_background_color: "#FFFFFF"
    icon_background_color_dark: "#121212"

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
